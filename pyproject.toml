[project]
name = "scripttime-uz"
version = "0.1.0"
description = "Orthographic and temporal retrieval research prototype for Uzbek regulatory documents"
requires-python = ">=3.10"
authors = [{name = "Yakhyokhon Kodirov"}]
license = {text = "MIT"}

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
